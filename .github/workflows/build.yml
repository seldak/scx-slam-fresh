name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common libbpf-dev libelf-dev zlib1g-dev make gcc g++

      - name: Build (skip if runner lacks BTF)
        run: |
          if [ -e /sys/kernel/btf/vmlinux ]; then
            make SLAM_FULL_SWITCH=0
          else
            echo "Runner lacks /sys/kernel/btf/vmlinux; skipping BPF build."
            echo "This repo is expected to build on a machine with kernel BTF enabled."
          fi
